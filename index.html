<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>rena-rena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <!-- 上部：ゲージ -->
  <header class="top">
    <div class="top-row">
      <span class="label">ふたりのロードマップ</span>
      <button id="userBtn" class="user-btn" aria-label="目標一覧を開く">
        <img id="iconImg" alt="">
        <!-- 画像がないときの標準アイコン（コードで描いた人型） -->
        <svg id="iconDefault" viewBox="0 0 24 24" hidden>
          <circle cx="12" cy="9" r="4" />
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
        </svg>
      </button>
    </div>
    <div class="gauge">
      <div id="gaugeFill" class="gauge-fill"></div>
    </div>
    <div class="status-row">
      <div class="days">付き合って <span id="daysNum">0</span> 日目</div>
      <div id="percentText" class="percent">0%</div>
    </div>
  </header>

  <!-- 真ん中：画像 -->
  <main class="center">
    <img id="centerImg" alt="" role="button" aria-label="タップしてみて">
    <div id="imgPlaceholder" class="placeholder" hidden>
      <small>img/center.gif を置くと<br>ここに表示されます</small>
    </div>
  </main>

  <!-- 下部：次の目標 -->
  <footer class="bottom">
    <div class="next-label">つぎの目標</div>
    <div id="nextGoal" class="next-goal"></div>
  </footer>

  <!-- ポップアップ：目標一覧 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-label="目標一覧">
      <div class="modal-head">
        <span>目標いちらん</span>
        <button id="closeBtn" class="close-btn" aria-label="閉じる">×</button>
      </div>
      <ul id="goalList" class="goal-list"></ul>
    </div>
  </div>

  <!-- ポップアップ：画像をタップしたとき -->
  <div id="surprise" class="modal" hidden>
    <div class="surprise-box">
      <div id="surpriseText" class="surprise-text"></div>
      <img id="surpriseImg" alt="">
      <div id="surprisePlaceholder" class="placeholder small" hidden>
        <small>img/popup.gif を置くと<br>ここに表示されます</small>
      </div>
    </div>
  </div>

  <script src="goals.js?v=6"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
