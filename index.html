<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>rena-rena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上部：ゲージ -->
  <header class="top">
    <div class="top-row">
      <span class="label">ふたりのロードマップ</span>
      <button id="userBtn" class="user-btn" aria-label="目標一覧を開く">👤</button>
    </div>
    <div class="gauge">
      <div id="gaugeFill" class="gauge-fill"></div>
    </div>
    <div id="percentText" class="percent">0%</div>
  </header>

  <!-- 真ん中：画像（img/center.gif を置くと表示される） -->
  <main class="center">
    <img id="centerImg" src="img/center.gif" alt="">
    <div id="imgPlaceholder" class="placeholder" hidden>
      <span>💞</span>
      <small>img/center.gif を置くと<br>ここに表示されます</small>
    </div>
  </main>

  <!-- 下部：次の目標 -->
  <footer class="bottom">
    <div class="next-label">次の目標</div>
    <div id="nextGoal" class="next-goal"></div>
  </footer>

  <!-- ポップアップ：目標一覧 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <span>目標一覧</span>
        <button id="closeBtn" class="close-btn" aria-label="閉じる">×</button>
      </div>
      <ul id="goalList" class="goal-list"></ul>
    </div>
  </div>

  <script src="goals.js"></script>
  <script src="script.js"></script>
</body>
</html>
